<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Dark from the first paint, before the stylesheet arrives. -->
    <style>
      html {
        background: #0c0c0c;
      }
      .ai-gradient-defs {
        position: absolute;
      }
    </style>
    <meta
      name="description"
      content="贝尔灵画是设计 Agent：说一句需求，它就规划并交付一整套物料，比如活动海报、电商主图、汇报封面和品牌 Logo，图上的文字自动校对，还能在画布上接着改。"
    />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <title>贝尔灵画｜设计 Agent，一句话出整套物料</title>
  </head>
  <body>
    <!-- The AI's blue-to-violet for icon strokes (stroke: url(#ai-gradient)); the stylesheet
         sets its stops from --ai-from and --ai-to. -->
    <svg class="ai-gradient-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient
          id="ai-gradient"
          x1="2"
          y1="2"
          x2="22"
          y2="22"
          gradientUnits="userSpaceOnUse"
        >
          <stop offset="0" stop-color="#bfd0ff" />
          <stop offset="1" stop-color="#d7c4ff" />
        </linearGradient>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
